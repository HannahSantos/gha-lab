name: Eventos

on: 
  workflow_dispatch:
    inputs:
      nome:
        description: " " 
        required: true
        default: "turma" 
        type: choice
        options:
          - Eu
          - Você
          - Lula
  push:
    paths:
      - "src/**"

jobs: 
  saudacao:
    runs-on: ubuntu-latest
    steps:
      - name: Olá com Evento
        run: "Olá ${{ inputs.nome }}, o evento realizado foi ${{ github.event_name }}"
